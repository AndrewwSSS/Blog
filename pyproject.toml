[tool.poetry]
name = "blog"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.2"
uvicorn = "^0.32.0"
pydantic-settings = "^2.6.0"
psycopg2-binary = "^2.9.10"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = {extras = ["email"], version = "^2.9.2"}
asyncpg = "^0.29.0"
pyjwt = "^2.9.0"
httpx = "^0.27.2"
celery = {extras = ["asyncio"], version = "^5.4.0"}
flower = "^2.0.1"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
tenacity = "^9.0.0"
elasticsearch = "^8.16.0"
aiohttp = "^3.11.2"
redis = "^5.2.0"
aiokafka = "^0.12.0"
alembic = "^1.14.0"
itsdangerous = "^2.2.0"
aioredis = "^2.0.1"
aiosqlite = "^0.20.0"

[tool.pytest.ini_options]
pythonpath = [".", "app"]
asyncio_mode="auto"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

