services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka

  notification-service:
    build:
      context: .
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - TEST_DB_HOST=test_db
      - PYTHONPATH=/app
    command: python app/pubsub/start_notification_service.py
    container_name: notification-service
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api_prestart:
        condition: service_completed_successfully

  db:
    image:
      postgres:16.0-alpine3.17
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 5s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: elasticsearch:8.8.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasiticsearch_data:/usr/share/elasticsearch/data

#  kibana:
#    image: kibana:8.8.0
#    ports:
#      - "5601:5601"
#    environment:
#      - 'ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]'

  api_prestart:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - TEST_DB_HOST=test_db
      - PYTHONPATH=/app

  api:
    build:
      context: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - TEST_DB_HOST=test_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    container_name: api
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api_prestart:
        condition: service_completed_successfully

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: redis

  celery:
    build:
      context: .
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    env_file:
      - .env
    command:
      celery -A app.celery.tasks:celery worker -l INFO
    container_name: celery-worker
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api_prestart:
        condition: service_completed_successfully

volumes:
  db_volume:
  elasiticsearch_data:
  kafka_data:
  zookeeper_data: