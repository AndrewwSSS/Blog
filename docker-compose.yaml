services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data

  notification-service:
    build:
      context: .
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PYTHONPATH=/app
    command: python app/pubsub/start_notification_service.py
    container_name: notification-service
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api_prestart:
        condition: service_completed_successfully

  db:
    image: postgres:16.0-alpine3.17
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 5s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: elasticsearch:8.8.0
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasiticsearch_data:/usr/share/elasticsearch/data

  api_prestart:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PYTHONPATH=/app

  api:
    build:
      context: .
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    container_name: api
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api_prestart:
        condition: service_completed_successfully

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    container_name: redis

  celery:
    build:
      context: .
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    env_file:
      - .env
    command:
      celery -A app.celery.app:celery worker -l INFO
    container_name: celery-worker
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api_prestart:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: .
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    env_file:
      - .env
    command: celery -A app.celery.app:celery beat -l INFO --schedule /tmp/celerybeat-schedule
    container_name: celery-beat
    depends_on:
      - redis
      - celery

  # Debugging tools, started only with `make up-debug`.
  flower:
    build:
      context: .
    profiles: [ debug ]
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    env_file:
      - .env
    command: celery -A app.celery.app:celery flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
      - celery

  kibana:
    image: kibana:8.8.0
    profiles: [ debug ]
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

volumes:
  db_volume:
  elasiticsearch_data:
  kafka_kraft_data:
